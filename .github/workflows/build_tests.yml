name: Run UnitTests

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'tests/**'
      - 'tugaphone/**'
      - '.github/workflows/build_tests.yml'
  workflow_dispatch:

jobs:
  build_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      install_extras: 'test'
      test_path: 'tests'
